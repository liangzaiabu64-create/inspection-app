// ============================================================
// Excel出力(XLSX があれば)
// ============================================================
function exportExcel(){
  if(typeof XLSX==='undefined'){ alert('Excel機能は現在利用できません(ライブラリ読込不可)。印刷機能をご利用ください。'); return; }
  var m = getMachine(); var items = getItems(); var records = getRecords();
  var cols = getMonthColumns(STATE.machineId, STATE.printMonth);
  var isWeek = (STATE.machineId === 'shikomi');
  var mm = STATE.printMonth.split('-')[1];
  var header = ['No.','場所','側','点検内容'];
  cols.forEach(function(c){ header.push(isWeek ? (c.label+(c.sub?'('+c.sub+')':'')) : c.label); });
  header.push('備考');
  var aoa = [[mm+'月度 '+m.name+m.subtitle], [], header];
  items.forEach(function(it){
    var row = [it.no, it.place, it.side, it.content];
    var notes = [];
    cols.forEach(function(c){
      var r = pickColResult(c, records, it.id);
      row.push(r.v==='ok'?'○':r.v==='ng'?'×':'');
      if(r.note && r.v==='ng') notes.push((isWeek?c.label:(r.day+'日'))+': '+r.note);
    });
    row.push(notes.join(' / '));
    aoa.push(row);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, mm+'月');

  // 不具合一覧シート(未完了・完了の両方)
  var openIssues = openIssuesAsOf(STATE.printMonth);
  var doneIssues = doneIssuesInMonth(STATE.printMonth);
  var iaoa = [];
  iaoa.push(['■ 未解決の不具合一覧 ('+openIssues.length+'件) ※前月からの繰り越し含む・完了済みは除く']);
  iaoa.push(['発生日','No.','場所','側','点検内容','不具合内容','対応コメント','担当者','対応状況']);
  if(openIssues.length===0){
    iaoa.push(['未解決の不具合はありません。']);
  } else {
    openIssues.forEach(function(is){
      iaoa.push([is.date||'', issueNoCell(is), is.place||'', is.side||'', is.content||'', is.detail||'', is.comment||'', is.assignee||'', is.status||'']);
    });
  }
  iaoa.push([]);
  iaoa.push(['■ '+mm+'月に完了した不具合一覧 ('+doneIssues.length+'件)']);
  iaoa.push(['発生日','No.','完了日','場所','側','点検内容','不具合内容','対応コメント','担当者']);
  if(doneIssues.length===0){
    iaoa.push(['完了した不具合はありません。']);
  } else {
    doneIssues.forEach(function(is){
      iaoa.push([is.date||'', issueNoCell(is), is.doneDate||'', is.place||'', is.side||'', is.content||'', is.detail||'', is.comment||'', is.assignee||'']);
    });
  }
  var iws = XLSX.utils.aoa_to_sheet(iaoa);
  iws['!cols'] = [{wch:12},{wch:6},{wch:14},{wch:12},{wch:32},{wch:32},{wch:28},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb, iws, '不具合一覧');

  XLSX.writeFile(wb, m.name+'_'+STATE.printMonth+'.xlsx');
}

function getStats(){
  var cur = getCurrent(); var ok=0,ng=0;
  for(var k in cur.results){ if(cur.results[k]==='ok')ok++; else if(cur.results[k]==='ng')ng++; }
  return { ok:ok, ng:ng, done:ok+ng, total:getItems().length };
}
// 点検画面の並び: 項目を No. の順に並べ、同じ場所が続くところを1つの見出しにまとめる。
// 以前は場所ごとに全項目を1か所へ集めていたため、項目管理で No. を変えて別の場所の
// 間へ移した項目が元の場所の見出しの下に集められ、No. が 1, 17, 2, 3… と飛んで見えていた。
// いまは No. の順をそのまま守り、同じ場所が離れて出てくるときは見出しも2回出る。
function getPlaceRuns(){
  var items = getItems().map(function(it, i){ return { it: it, i: i }; });
  // No. が同じ項目(シートの手編集など)は元の並びのまま(古いブラウザの並べ替えでも順が揺れないように)
  items.sort(function(a, b){ return ((a.it.no||0) - (b.it.no||0)) || (a.i - b.i); });
  var runs = [];
  items.forEach(function(x){
    var last = runs[runs.length-1];
    if(!last || last.place !== x.it.place){ last = { place: x.it.place, items: [] }; runs.push(last); }
    last.items.push(x.it);
  });
  return runs;
}
function getDateList(){
  var recs = getRecords(); var list=[];
  for(var d in recs){
    var r = recs[d];
    if(r && r.results && Object.keys(r.results).length>0) list.push(d);
  }
  list.sort(function(a,b){ return b.localeCompare(a); });
  return list;
}
function getMachineStat(mid){
  var recs = STATE.allRecords[mid]||{}; var c=0;
  for(var d in recs){ var r=recs[d]; if(r&&r.results&&Object.keys(r.results).length>0)c++; }
  return c;
}

// 月次表の列定義を返す。
// NID(毎日点検): 1日ごとに1列。
// 仕込み(週1点検): 月曜始まりの週ごとに1列(第1週〜)。
// 返り値: [{ label, sub, dates:['YYYY-MM-DD', ...] }, ...]
function getMonthColumns(mid, ym){
  var parts = ym.split('-');
  var year = Number(parts[0]), month = Number(parts[1]);
  var totalDays = daysInMonth(ym);
  var cols = [];
  if(mid !== 'shikomi'){
    // 日ごと
    for(var d=1; d<=totalDays; d++){
      cols.push({ label:String(d), sub:'', dates:[ym+'-'+pad(d)] });
    }
    return cols;
  }
  // 月曜始まりの週ごとにまとめる
  // JS: getDay() 0=日,1=月,...6=土 → 月曜始まりの曜日インデックス(0=月..6=日)に変換
  function mondayIndex(dt){ return (dt.getDay()+6)%7; }
  var weekNo = 0;
  var d2 = 1;
  while(d2 <= totalDays){
    weekNo++;
    var startDay = d2;
    var dates = [];
    // この週の終わり(日曜)まで、または月末まで集める
    while(d2 <= totalDays){
      var dt = new Date(year, month-1, d2);
      dates.push(ym+'-'+pad(d2));
      var isSunday = (mondayIndex(dt) === 6);
      d2++;
      if(isSunday) break; // 日曜で週を区切る
    }
    var endDay = startDay + dates.length - 1;
    cols.push({ label:'第'+weekNo+'週', sub:startDay+'〜'+endDay+'日', dates:dates });
  }
  return cols;
}

// 列(複数日)の中から、その項目の代表的な判定と備考を取り出す。
// NGがあればNG優先。点検した日付も返す。
function pickColResult(col, records, itemId){
  var result = null, note = '', dayUsed = '';
  var rank = { ok:1, ng:2 };
  for(var i=0;i<col.dates.length;i++){
    var dk = col.dates[i];
    var rec = records[dk];
    if(!rec || !rec.results) continue;
    var v = rec.results[itemId];
    if(v!=='ok' && v!=='ng') continue;
    var n = (rec.notes && rec.notes[itemId]) || '';
    var dayNum = Number(dk.split('-')[2]);
    // 優先度: ×(ng) > ○(ok)。重い判定を採用。NGは複数あれば最後のNGのメモ/日。
    if(result===null || rank[v] > rank[result] || (v==='ng' && result==='ng')){
      result = v;
      if(v==='ng'){ note = n; dayUsed = dayNum; }
      else if(!dayUsed){ dayUsed = dayNum; }
    }
  }
  return { v:result, note:note, day:dayUsed };
}

      '<h3>⚠ Google Apps Script の設定が必要です</h3>'+

  var html = '';

}

function renderCheck(){
  var cur = getCurrent();
  var stats = getStats();
  var ed = STATE.editMode;
  var dis = ed ? '' : 'disabled';
  var h = '';
  h += '<div class="top-bar no-print">';

  h += '<div class="field"><label>点検者</label>'+staffSelectHTML('inp-inspector', cur.inspector, dis)+'</div>';
  h += '<div class="field"><label>確認者</label>'+staffSelectHTML('inp-checker', cur.checker, dis)+'</div>';
  h += '</div>';

  h += '<div class="summary no-print" id="summary-box">';
  h += sc('点検済み', stats.done+' / '+stats.total, '');
  h += sc('× NG', stats.ng, 'var(--c-danger)');
  h += '</div>';

  h += '<div class="progress-bar no-print"><div class="progress-fill" id="progress-fill" style="width:'+(stats.total?(stats.done/stats.total*100):0)+'%"></div></div>';

  // フィルタ + NGジャンプ(取りこぼし防止の導線)
  var f = STATE.checkFilter || 'all';
  var undone = stats.total - stats.done;
  h += '<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">';
  h += '<div class="filter-group">';
  h += '<button class="filter-btn '+(f==='all'?'on':'')+'" data-filter="all">すべて ('+stats.total+')</button>';
  h += '<button class="filter-btn '+(f==='undone'?'on':'')+'" data-filter="undone">未点検 ('+undone+')</button>';
  h += '<button class="filter-btn '+(f==='ng'?'on':'')+'" data-filter="ng">NG ('+stats.ng+')</button>';
  h += '</div>';
  if(stats.ng>0){ h += '<button class="btn sm danger" id="btn-jump-ng" style="margin-left:auto">⚠ NGへ移動</button>'; }
  h += '</div>';

  h += '<div class="no-print">';
  var shownTotal = 0;
  var blocks = [];
  getPlaceRuns().forEach(function(run){
    // このグループ内で、フィルタに合致する項目だけ抽出
    var vis = run.items.filter(function(it){
      var v = cur.results[it.id];
      if(f==='undone') return !v;
      if(f==='ng') return v==='ng';
      return true;
    });
    if(vis.length===0) return; // フィルタで空のグループは見出しごと隠す
    // 間の場所がフィルタで隠れて同じ場所が続くときは、見出しを1つにまとめる
    var last = blocks[blocks.length-1];
    if(last && last.place === run.place){
      last.items = last.items.concat(run.items);
      last.visible = last.visible.concat(vis);
    } else {
      blocks.push({ place: run.place, items: run.items, visible: vis });
    }
  });
  checkGroups = [];
  blocks.forEach(function(b){
    var place = b.place, list = b.items, visible = b.visible;
    // グループ進捗(このグループの完了数/項目数)。○× を押した直後は updateGroupCounts が数え直す
    var gdone = 0;
    list.forEach(function(it){ if(cur.results[it.id]) gdone++; });
    h += '<div class="group-header">📁 '+esc(place)+
      ' <span style="font-weight:400;margin-left:6px" data-group-count="'+checkGroups.length+'">('+gdone+'/'+list.length+' 完了)</span></div>';
    checkGroups.push(list.map(function(it){ return it.id; }));
    visible.forEach(function(it){
      shownTotal++;
      var v = cur.results[it.id];
      var note = cur.notes[it.id]||'';
      var cls = v==='ok'?'is-ok':v==='ng'?'is-ng':'';
      if(it.photoId) cls += ' has-photo';
      h += '<div class="check-row '+cls+' '+(ed?'':'readonly')+'" data-row="'+it.id+'">';
      h += checkRowInner(it, v, note);
      h += '</div>';
    });
  });
  if(shownTotal===0){
    h += '<div class="empty">'+(f==='undone'?'未点検の項目はありません 👍':f==='ng'?'NGの項目はありません 👍':'項目がありません')+'</div>';
  }
  h += '</div>';

  h += '<div class="no-print" style="margin-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">';
  h += '<button class="btn danger" id="btn-clearday" '+dis+'>🗑 この日の記録を削除</button>';
  h += '</div>';
  return h;
}

// 1行分の中身(check-rowの内側)を生成
function checkRowInner(it, v, note){
  var dis = STATE.editMode ? '' : 'disabled';
  var h = '';
  h += '<div class="row-no">'+it.no+'</div>';
  if(it.photoId){
    h += '<img class="row-photo" src="'+photoUrl(it.photoId,true)+'" data-photo="'+it.photoId+'" alt="見本写真" loading="lazy">';
  }
  h += '<div class="row-body"><div><span class="row-place">'+esc(it.place)+'</span>'+(it.side?'<span class="row-side">'+esc(it.side)+'</span>':'')+'</div>';
  h += '<div class="row-content">'+esc(it.content)+'</div>';

  h += '<button class="judge-btn '+(v==='ok'?'ok-on':'')+'" data-result="ok" data-id="'+it.id+'" '+dis+'>○</button>';
  h += '<button class="judge-btn '+(v==='ng'?'ng-on':'')+'" data-result="ng" data-id="'+it.id+'" '+dis+'>×</button>';

  if(v==='ng'){
    h += '<div class="ng-note">'+cmNgHintHTML(it)+'<textarea data-note="'+it.id+'" placeholder="不具合内容を記入(任意)" '+dis+'>'+esc(note)+'</textarea></div>';
  }

// 1行内のボタン・テキストエリアにハンドラを付ける
function attachRowHandlers(row, it){
  var btns = row.querySelectorAll('[data-result]');
  for(var i=0;i<btns.length;i++){
    btns[i].onclick = (function(id,val){ return function(){ setResult(id,val); }; })(btns[i].getAttribute('data-id'), btns[i].getAttribute('data-result'));
  }

  if(ta){
    ta.onchange = (function(id){ return function(){ setNote(id, this.value); }; })(ta.getAttribute('data-note'));
  }
  var ph = row.querySelector('[data-photo]');
  if(ph){
    ph.onclick = (function(pid){ return function(){ openPhotoModal(pid); }; })(ph.getAttribute('data-photo'));
  }
  attachCountermeasureHandlers(row);
}
function sc(label, value, color){
  return '<div class="sc"><div class="sc-label">'+label+'</div><div class="sc-value" style="color:'+(color||'inherit')+'">'+value+'</div></div>';
}

function renderIssues(){
  var m = getMachine();
  var issues = getIssues();
  // 未完了のみ表示(完了したものは画面から消す。データはシートに残る)
  var open = issues.filter(function(is){ return is.status!=='完了'; }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  var h = '<div style="padding:14px;background:var(--c-danger-bg);border:1px solid var(--c-danger-bd);border-radius:var(--r-lg);margin-bottom:14px;font-size:14px;color:var(--c-text2)">';
  h += '<b style="color:var(--c-danger)">'+esc(m.name)+' 不具合リスト</b><br>';
  h += '点検で×がついた項目が自動で登録されます。対応が済んだら「✓ 完了」ボタンを押すと一覧から消え「完了済み」シートへ移動します(記録は残ります)。「🗑 削除」は不具合自体を取り消します。';
  h += '</div>';

  if(open.length===0){
    h += '<div class="empty">未解決の不具合はありません 👍</div>';

  }

  h += '<div style="font-size:14px;font-weight:500;color:var(--c-danger);margin:8px 0">未解決 ('+open.length+'件)</div>';
  open.forEach(function(is){ h += issueCard(is); });
  return h;
}

// 不具合の項目の、今の No.。
// 不具合は登録した時点の No. を写して持っているが、項目管理で並べ替えると番号が変わる。
// 点検画面・月次の点検表と同じ番号になるよう、表示のたびに今の項目一覧から引き直す
// (シートに保存された登録時の No. は書き換えない)。
// 項目が削除されて見つからなければ null。登録時の番号は、今は別の項目の番号に
// なっていることがあり、取り違えのもとになるため使わない。
// 項目idの無い古い行は、引き直せないので登録時の番号のまま。
function issueCurrentNo(is){
  if(!is.itemId) return (is.no != null) ? is.no : '';
  var items = getItems();
  for(var i=0;i<items.length;i++){ if(items[i].id === is.itemId) return items[i].no; }
  return null;
}
// 表の No. 欄に入れる値(削除された項目は「削除」)
function issueNoCell(is){
  var n = issueCurrentNo(is);
  return n === null ? '削除' : n;
}
// 文中に出す形(「No.17」/「削除済みの項目」)
function issueNoLabel(is){
  var n = issueCurrentNo(is);
  return n === null ? '削除済みの項目' : 'No.' + n;
}

function issueCard(is){
  var days = daysSince(is.date);
  var statusColors = { '未着手':'var(--c-danger)', '対応中':'var(--c-warn)', '完了':'var(--c-success)' };
  var sc = statusColors[is.status] || 'var(--c-text2)';
  var isDone = is.status==='完了';
  var monthLabel = is.date ? (is.date.split('-')[0]+'年'+is.date.split('-')[1]+'月') : '';
  var h = '<div style="padding:14px;background:'+(isDone?'var(--c-bg2)':'var(--c-bg)')+';border:1px solid '+(isDone?'var(--c-bd)':'var(--c-danger-bd)')+';border-radius:var(--r-lg);margin-bottom:10px;'+(isDone?'opacity:0.75':'')+'">';
  // ヘッダ行
  h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">';
  h += '<div style="flex:1;min-width:200px">';
  h += '<div><span class="row-place">'+esc(is.place)+'</span>'+(is.side?'<span class="row-side">'+esc(is.side)+'</span>':'')+' <span style="font-size:12px;color:var(--c-text3)">'+esc(issueNoLabel(is))+'</span></div>';
  h += '<div style="font-size:15px;margin-top:4px">'+esc(is.content)+'</div>';
  h += '</div>';
  // 経過バッジ
  h += '<div style="text-align:right;font-size:12px;color:var(--c-text2)">';
  h += '発生: '+esc(monthLabel)+'<br>';
  if(!isDone){ h += '<span style="color:'+(days>=30?'var(--c-danger)':days>=14?'var(--c-warn)':'var(--c-text2)')+';font-weight:500">経過 '+days+'日</span>'; }
  else { h += '完了: '+esc(is.doneDate); }
  h += '</div>';
  h += '</div>';
  // 不具合内容(編集可)
  h += '<div style="margin-top:10px">';
  h += '<label style="font-size:12px;color:var(--c-danger);display:block;margin-bottom:2px">不具合内容</label>';
  h += '<textarea data-issue-detail="'+is.id+'" placeholder="どのような異常か" style="width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--c-danger-bd);border-radius:var(--r-md);font-size:14px;font-family:var(--font);background:var(--c-danger-bg);color:var(--c-text);box-sizing:border-box;resize:vertical">'+esc(is.detail)+'</textarea>';
  h += '</div>';
  // 対応コメント(編集可)
  h += '<div style="margin-top:8px">';
  h += '<label style="font-size:12px;color:var(--c-info);display:block;margin-bottom:2px">対応コメント(経緯・進捗メモ)</label>';
  h += '<textarea data-issue-comment="'+is.id+'" placeholder="対応の経緯や進捗を記入" style="width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--c-info-bd);border-radius:var(--r-md);font-size:14px;font-family:var(--font);background:var(--c-info-bg);color:var(--c-text);box-sizing:border-box;resize:vertical">'+esc(is.comment||'')+'</textarea>';
  h += '</div>';
  // 操作行: 担当者・状況
  h += '<div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">';
  h += '<label style="font-size:12px;color:var(--c-text2)">担当: '+assigneeSelectHTML(is.id, is.assignee)+'</label>';
  h += '<label style="font-size:12px;color:var(--c-text2)">状況: <select data-issue-status="'+is.id+'" style="height:34px;padding:0 8px;border:1px solid var(--c-bd);border-radius:var(--r-md);font-family:var(--font);color:'+sc+';font-weight:500">';
  ['未着手','対応中','完了'].forEach(function(s){
    h += '<option value="'+s+'" '+(is.status===s?'selected':'')+'>'+s+'</option>';
  });
  h += '</select></label>';
  if(!isDone){
    h += '<button class="btn sm" data-issue-complete="'+is.id+'" style="margin-left:auto;background:var(--c-success);color:#fff;border:none;font-weight:600">✓ 完了</button>';
    h += '<button class="btn sm danger" data-issue-delete="'+is.id+'">🗑 削除</button>';
  }
  h += '</div>';
  h += '</div>';
  return h;
}

function renderHistory(){
  var m = getMachine();
  var records = getRecords();
  var dl = getDateList();
  var h = '<div style="padding:14px;background:var(--c-bg2);border-radius:var(--r-lg);margin-bottom:14px;font-size:14px;color:var(--c-text2)">'+
    esc(m.name)+'の履歴。「最新を取得」で他の人の入力を反映、「シートを開く」で生データを直接確認できます。</div>';
  if(dl.length===0){ h += '<div class="empty">まだ点検記録がありません</div>'; return h; }
  dl.forEach(function(d){
    var r = records[d]; var ok=0,ng=0;
    for(var k in r.results){ if(r.results[k]==='ok')ok++; else if(r.results[k]==='ng')ng++; }

// ============================================================
// 分析の土台: × の「発生」
// ============================================================
// 直していない不具合には、点検のたびに × が付き続ける。
// × が付いた日数をそのまま数えると、1件の未修理が何十回にも数えられてしまう。
// そこで項目ごとに判定を日付順に並べ、○ から × に変わった時点を「1件の発生」とする。
//
//  ・続いているかどうかは、暦日ではなく「点検記録の並び」で判断する。
//    週末をはさむ金曜と月曜の ×、週1点検で毎週続く × は、間に ○ が無ければ同じ1件。
//  ・その項目に判定が入っていない日(点検していない日)は並びに含めない。
//  ・最後の判定が × のままの発生は「未修理」(open: true)とする。

// 項目ごとの点検の履歴をまとめる。戻り値は { 項目id: 履歴 } で、履歴は次のとおり。
//   judgedDates: 判定(○か×)が入っている日付(古い順)
//   firstDate:   最初に判定が入った日
//   lastDate:    最後に判定が入った日
//   ngDays:      × が付いた日数
//   episodes:    発生の一覧。各要素は
//                { start: 発生日, end: 最後に×が付いた日, ngDays: その発生で×が付いた日数, open: 未修理か }
function buildItemHistories(records){
  var histories = {};
  var dates = Object.keys(records).sort();   // "YYYY-MM-DD" は文字列の並びがそのまま日付順
  for(var i=0; i<dates.length; i++){
    var date = dates[i];
    var rec = records[date];
    if(!rec || !rec.results) continue;
    for(var itemId in rec.results){
      var judge = rec.results[itemId];
      if(judge !== 'ok' && judge !== 'ng') continue;

      var h = histories[itemId];
      if(!h){
        h = { judgedDates: [], firstDate: date, lastDate: date, ngDays: 0, episodes: [] };
        histories[itemId] = h;
      }
      h.judgedDates.push(date);
      h.lastDate = date;

      var latest = h.episodes.length ? h.episodes[h.episodes.length - 1] : null;
      var stillOpen = !!(latest && latest.open);
      if(judge === 'ng'){
        h.ngDays++;
        if(stillOpen){
          // 前回の点検から × が続いている = 同じ不具合がまだ直っていない
          latest.end = date;
          latest.ngDays++;
        } else {
          // ○ のあと(または初めて)の × = 新しい発生
          h.episodes.push({ start: date, end: date, ngDays: 1, open: true });
        }
      } else if(stillOpen){
        // ○ に戻ったので、この発生はここで終わり
        latest.open = false;
      }
    }
  }
  return histories;
}

// 項目管理から削除された項目の、点検時点の内容({ no, place, side, content })を記録から探す。
// 記録には点検時点の項目のコピーが残っている(新しい記録から順に探す)。見つからなければ null。
function findItemSnapshot(records, itemId){
  var dates = Object.keys(records).sort().reverse();
  for(var i=0; i<dates.length; i++){
    var rec = records[dates[i]];
    if(rec && rec.items && rec.items[itemId]) return rec.items[itemId];
  }
  return null;
}

// 2つの日付("YYYY-MM-DD")の間の日数。to が後なら正の数。
function daysBetween(fromDate, toDate){
  return Math.round((new Date(toDate + 'T00:00:00') - new Date(fromDate + 'T00:00:00')) / 86400000);
}

// 年月("YYYY-MM")を fromYm から toYm まで1か月ずつ並べる(両端を含む)
function monthRange(fromYm, toYm){
  var months = [];
  var year = Number(fromYm.substring(0,4));
  var month = Number(fromYm.substring(5,7));
  while(true){
    var ym = year + '-' + pad(month);
    if(ym > toYm) break;
    months.push(ym);
    month++;
    if(month > 12){ month = 1; year++; }
  }
  return months;
}

// 分析で横軸に使う月の並び。記録のある最初の月から今月まで(発生0件の月も含める)。
// 0件の月を省くと、棒やマスが詰まって、何も起きなかった期間が見えなくなる。
function analysisMonths(records){
  var dates = Object.keys(records).sort();
  if(dates.length === 0) return [];
  var firstYm = dates[0].substring(0,7);
  var lastYm = todayStr().substring(0,7);
  var lastRecordYm = dates[dates.length - 1].substring(0,7);
  if(lastRecordYm > lastYm) lastYm = lastRecordYm;
  return monthRange(firstYm, lastYm);
}

// 月ごとの「新たな発生」の件数。[{ ym: "YYYY-MM", count: 件数 }, ...]
function countEpisodesByMonth(histories, months){
  var counts = {};
  for(var itemId in histories){
    histories[itemId].episodes.forEach(function(ep){
      var ym = ep.start.substring(0,7);
      counts[ym] = (counts[ym] || 0) + 1;
    });
  }
  return months.map(function(ym){ return { ym: ym, count: counts[ym] || 0 }; });
}

// 場所 × 月 ごとの「新たな発生」の件数。
// 戻り値: { months: 年月の並び, places: 発生のあった場所(五十音順), cell: { "場所|年月": 件数 } }
function countEpisodesByPlaceAndMonth(histories, items, months){
  var placeOf = {};
  items.forEach(function(it){ placeOf[it.id] = it.place || '(未設定)'; });
  var cell = {}, placeSeen = {};
  for(var itemId in histories){
    var place = placeOf[itemId] || '(未設定)';
    histories[itemId].episodes.forEach(function(ep){
      var key = place + '|' + ep.start.substring(0,7);
      cell[key] = (cell[key] || 0) + 1;
      placeSeen[place] = true;
    });
  }
  return { months: months, places: Object.keys(placeSeen).sort(), cell: cell };
}

// ============================================================
// 点検実施率
// ============================================================
// 分母は「点検すべきだった日(週)」の数、分子はそのうち実際に点検した数。
//  ・NID(毎日点検)は日、仕込み(週1点検)は週を単位にする。
//    月の日数を分母にすると、週1点検の設備は実施していても2割程度に見えてしまう。
//  ・土日は休みとして分母に入れない。ただし土日でも点検した日は、分子・分母の両方に数える。
//    (以前は土日も分母に入れていたため、全営業日に点検しても76%のように低く出ていた)
//    週単位では、平日を1日も含まない週(月初や月末の土日だけの週)を同じように扱う。
//  ・まだ来ていない日・週は分母に入れない(進行中の月で、月初ほど低く出るのを防ぐ)。
//  ・点検の記録がある日は、土日でも・まだ来ていない日付でも、必ず分子・分母に数える。
//  ※ 平日の祝日は、いまは「点検すべき日」として数える。除くには稼働日カレンダーが要る。

function isWeekday(date){
  var dayOfWeek = new Date(date + 'T00:00:00').getDay();   // 0=日曜 … 6=土曜
  return dayOfWeek !== 0 && dayOfWeek !== 6;
}

// その日に判定が1件でも入っているか(= 点検したか)
function hasJudgment(rec){
  return !!(rec && rec.results && Object.keys(rec.results).length > 0);
}

// 戻り値: { done: 点検した数, due: 点検すべきだった数, rate: 実施率(%), unit: '日' か '週' }
function computeInspectionRate(machineId, ym, records){
  var today = todayStr();
  var due = 0, done = 0;
  getMonthColumns(machineId, ym).forEach(function(col){
    var inspected = col.dates.some(function(d){ return hasJudgment(records[d]); });
    if(inspected){                                            // 点検した日・週は常に数える
      due++;
      done++;
      return;
    }
    var notYet = col.dates[0] > today;                        // まだ来ていない日・週
    var includesWeekday = col.dates.some(isWeekday);          // 土日だけの日・週は休み
    if(!notYet && includesWeekday) due++;                     // 点検すべきだったのに、していない
  });
  return {
    done: done,
    due: due,
    rate: due ? Math.round(done / due * 100) : 0,
    unit: machineId === 'shikomi' ? '週' : '日'
  };
}

// ============================================================
// 未完了の不具合の滞留日数
// ============================================================
// 発生からの経過日数で4つに区分けする。色は画面の一覧とそろえる。
var AGE_BUCKETS = [
  { label: '0〜7日',   from: 0,  to: 7,        color: 'var(--c-text2)' },
  { label: '8〜30日',  from: 8,  to: 30,       color: 'var(--c-warn)' },
  { label: '31〜90日', from: 31, to: 90,       color: 'var(--c-danger)' },
  { label: '91日以上', from: 91, to: Infinity, color: 'var(--c-danger)' }
];

// 経過日数がどの区分に入るか
function ageBucketOf(days){
  for(var i=0; i<AGE_BUCKETS.length; i++){
    if(days >= AGE_BUCKETS[i].from && days <= AGE_BUCKETS[i].to) return AGE_BUCKETS[i];
  }
  return AGE_BUCKETS[0];
}

// 区分ごとの件数。openIssues は [{ is: 不具合, days: 経過日数 }, ...]
// 戻り値: [{ label, color, count }, ...](AGE_BUCKETS と同じ並び)
function countOpenIssuesByAge(openIssues){
  return AGE_BUCKETS.map(function(bucket){
    var count = openIssues.filter(function(o){ return ageBucketOf(o.days) === bucket; }).length;
    return { label: bucket.label, color: bucket.color, count: count };
  });
}

// 日付("YYYY-MM-DD")を days 日ずらす(負の数なら前へ)
function shiftDate(date, days){
  var d = new Date(date + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

// ============================================================
// 再発の傾向
// ============================================================
// 【Laplace検定】発生が時間とともに増えているか(悪化)・減っているか(改善)を判定する。
//   観測期間は「その項目を最初に点検した日」から「最後に点検した日」まで。
//   以前は最初の × を起点にしていたため、それまでの無事故期間が捨てられ、
//   「長く無事故だったのに急に増えた」という一番大事な悪化を見逃していた。
//   発生が少ないうちは検定に意味がないので、5件未満は「判定保留」とする。
// 【直近30日の急増】その項目の全発生のうち、直近30日に起きた割合が、
//   直近30日の点検回数の割合から見て偶然とは言いにくいほど高いかを判定する(二項検定)。
//   それまでのペースを「推定値」ではなく発生の総数で条件づけて比べるので、
//   発生の少ない項目でも誤警報が増えにくい。新しく起き始めた不具合をすぐに拾える。

var TREND_MIN_EPISODES = 5;          // これ未満の発生数では傾向を判定しない
var TREND_Z = 1.96;                  // 両側5%の境目
var SURGE_WINDOW_DAYS = 30;          // 「直近」とみなす日数
var SURGE_MIN_EPISODES = 2;          // 直近の発生がこれ未満なら急増とはみなさない
var SURGE_MIN_PAST_INSPECTIONS = 10; // それ以前の点検がこれ未満なら、比べる材料が足りない
var SURGE_P = 0.05;                  // これより起こりにくければ「急増」

// Laplace検定。戻り値: { trend: 'up'(悪化) | 'flat'(横ばい) | 'down'(改善) | 'hold'(判定保留), U: 検定統計量 }
function laplaceTrend(h){
  var T = daysBetween(h.firstDate, h.lastDate);          // 観測期間の長さ(日)
  var times = h.episodes.map(function(ep){ return daysBetween(h.firstDate, ep.start); });
  // 最後の点検日にちょうど新しい発生が始まった場合は、その発生で観測を打ち切ったとみなして
  // 最後の1件を除く(故障打切り)。含めると、その1件が必ず期間の端に来て悪化側に偏る。
  if(times.length > 0 && times[times.length-1] === T) times.pop();
  var n = times.length;
  if(n < TREND_MIN_EPISODES || T <= 0) return { trend: 'hold', U: null };

  var sum = times.reduce(function(a, b){ return a + b; }, 0);
  // 傾向がなければ、発生時刻の平均は期間の真ん中(T/2)あたりに来る。
  // 後ろに寄っていれば悪化、前に寄っていれば改善。
  var U = (sum / n - T / 2) / (T * Math.sqrt(1 / (12 * n)));
  var trend = 'flat';
  if(U > TREND_Z) trend = 'up';
  else if(U < -TREND_Z) trend = 'down';
  return { trend: trend, U: U };
}

// 二項分布で、n 回の試行で確率 q の事象が k 回以上起きる確率
function binomialAtLeast(k, n, q){
  if(k <= 0) return 1;
  if(k > n) return 0;
  var term = Math.pow(1 - q, n);       // 0回の確率
  var below = 0;                       // k 回未満の確率の合計
  for(var i=0; i<k; i++){
    below += term;
    term = term * (n - i) / (i + 1) * q / (1 - q);   // i回 → i+1回の確率
  }
  return Math.max(0, 1 - below);
}

// 直近30日の急増。戻り値: { surge: 急増か, recent: 直近の発生数 }
function recentSurge(h, today){
  var windowStart = shiftDate(today, -(SURGE_WINDOW_DAYS - 1));
  var recentInspections = h.judgedDates.filter(function(d){ return d >= windowStart; }).length;
  var pastInspections = h.judgedDates.length - recentInspections;
  var recent = h.episodes.filter(function(ep){ return ep.start >= windowStart; }).length;
  var total = h.episodes.length;
  if(recent < SURGE_MIN_EPISODES || pastInspections < SURGE_MIN_PAST_INSPECTIONS){
    return { surge: false, recent: recent };
  }
  // 発生の起きやすさが一定なら、全発生のうち直近に入る割合は、点検回数の割合(share)と同じになるはず
  var share = recentInspections / h.judgedDates.length;
  return { surge: binomialAtLeast(recent, total, share) < SURGE_P, recent: recent };
}

// 再発した項目(発生2件以上)の一覧。注意が必要な項目(悪化・急増)を先に、あとは発生の多い順。
function computeRecurrence(histories){
  var items = getItems();
  var today = todayStr();
  var out = [];
  for(var id in histories){
    var h = histories[id];
    if(h.episodes.length < 2) continue;
    var it = null;
    for(var k=0; k<items.length; k++){ if(items[k].id === id){ it = items[k]; break; } }
    var laplace = laplaceTrend(h);
    var surge = recentSurge(h, today);
    var last = h.episodes[h.episodes.length - 1];
    // 平均間隔は「観測した日数 ÷ 発生数」。発生と発生の間の平均では、
    // 最初の発生までと最後の発生以降の無事故期間が抜けて、短く出てしまう。
    var observedDays = daysBetween(h.firstDate, h.lastDate) + 1;
    out.push({
      itemId: id, it: it,
      count: h.episodes.length,
      daysPerEpisode: Math.round(observedDays / h.episodes.length),
      lastStart: last.start, lastOpen: last.open,
      trend: laplace.trend, U: laplace.U,
      surge: surge.surge
    });
  }
  out.sort(function(a, b){
    var warnA = (a.surge || a.trend === 'up') ? 1 : 0;
    var warnB = (b.surge || b.trend === 'up') ? 1 : 0;
    if(warnA !== warnB) return warnB - warnA;
    return b.count - a.count;
  });
  return out;
}

function monthTableHTML(items, records, days, forPrint){
  var cols = getMonthColumns(STATE.machineId, STATE.printMonth);
  var isWeek = (STATE.machineId === 'shikomi');
  var h = '<table'+(forPrint?' class="month-table"':' style="width:100%;border-collapse:collapse;font-size:9px;color:#000"')+'>';
  h += '<thead><tr'+(forPrint?'':' style="background:#d0d0d0"')+'>';
  var th = forPrint ? '' : ' style="border:1px solid #333;padding:2px;text-align:center"';
  h += '<th'+th+'>No.</th><th'+th+'>場所</th><th'+th+'>側</th><th'+th+(forPrint?'':' style="border:1px solid #333;padding:2px;min-width:200px"')+'>点検内容</th>';
  cols.forEach(function(c){
    var wcol = isWeek ? (forPrint?' style="width:40pt"':' style="border:1px solid #333;padding:2px;width:60px;text-align:center"')
                      : (forPrint?' class="day-col"':' style="border:1px solid #333;padding:2px;width:20px;text-align:center"');
    var head = isWeek ? (c.label + (c.sub?'<br><span style="font-weight:400;font-size:'+(forPrint?'5pt':'9px')+'">'+c.sub+'</span>':'')) : c.label;
    h += '<th'+wcol+'>'+head+'</th>';
  });
  if(forPrint) h += '<th style="width:90pt">備考</th>';
  h += '</tr></thead><tbody>';
  var td = forPrint ? '' : ' style="border:1px solid #333;padding:2px"';
  items.forEach(function(it){
    var notes = [];
    h += '<tr>';
    h += '<td'+(forPrint?' style="text-align:center"':' style="border:1px solid #333;padding:2px;text-align:center"')+'>'+it.no+'</td>';
    h += '<td'+td+'>'+esc(it.place)+'</td>';
    h += '<td'+(forPrint?' style="font-size:6pt"':' style="border:1px solid #333;padding:2px;font-size:8px"')+'>'+esc(it.side)+'</td>';
    h += '<td'+(forPrint?' style="font-size:7pt"':' style="border:1px solid #333;padding:2px;font-size:8px"')+'>'+esc(it.content)+'</td>';
    cols.forEach(function(c){
      var r = pickColResult(c, records, it.id);
      var v = r.v;
      if(r.note && v==='ng'){ notes.push((isWeek?(c.label):(r.day+'日'))+(r.day&&isWeek?'('+r.day+'日)':'')+':'+r.note); }
      if(forPrint){
        h += '<td class="'+(v==='ok'?'ok-cell':v==='ng'?'ng-cell':'')+'">'+(v==='ok'?'○':v==='ng'?'×':'')+'</td>';
      } else {
        var col = v==='ok'?'#060':v==='ng'?'#c00':'#000';
        var bg = v==='ng'?'#ffe8e8':'#fff';
        h += '<td style="border:1px solid #333;padding:2px;text-align:center;font-weight:bold;font-size:11px;color:'+col+';background:'+bg+'">'+(v==='ok'?'○':v==='ng'?'×':'')+'</td>';
      }
    });
    if(forPrint) h += '<td style="font-size:6pt">'+esc(notes.join(' / '))+'</td>';
    h += '</tr>';
  });
  // 点検者・確認者行(印刷時のみ)
  if(forPrint){
    ['点検者','確認者'].forEach(function(label,idx){
      h += '<tr><td colspan="4" style="font-weight:bold;text-align:center;padding:0 6px">'+label+'</td>';
      cols.forEach(function(c){
        // その列(週/日)で点検した日の担当名(最初に見つかったもの)
        // 氏名は「実際に判定が入っている日」から採る。氏名だけ入力して
        // 判定が1件も無い日を拾うと、点検していない日に点検者が印字され、
        // 週まとめ(仕込み)では同じ週の別人の名前が採用されてしまう。
        var name = '';
        for(var i=0;i<c.dates.length;i++){
          var rec = records[c.dates[i]];
          if(!rec || !rec.results || Object.keys(rec.results).length===0) continue;
          var nm = (idx===0?rec.inspector:rec.checker);
          if(nm){ name = nm; break; }
        }
        h += '<td style="font-size:6pt;text-align:center">'+esc(name?name.slice(0,3):'')+'</td>';
      });
      h += '<td></td></tr>';
    });
  }
  h += '</tbody></table>';
  return h;
}

function attachSyncHandlers(){
  if(el('btn-refresh')) el('btn-refresh').onclick = refresh;
  if(el('btn-retry-save')) el('btn-retry-save').onclick = function(){ resetAutoRetry(); retryFailedJobs(true); };
  if(el('btn-editmode')) el('btn-editmode').onclick = toggleEditMode;
}
function attachHandlers(){
  // 設備切替
  var mts = document.querySelectorAll('[data-machine]');
  for(var i=0;i<mts.length;i++){ mts[i].onclick = (function(mid){ return function(){ switchMachine(mid); }; })(mts[i].getAttribute('data-machine')); }
  // タブ
  var tbs = document.querySelectorAll('[data-tab]');
  for(var i=0;i<tbs.length;i++){ tbs[i].onclick = (function(t){ return function(){ switchTab(t); }; })(tbs[i].getAttribute('data-tab')); }
  attachSyncHandlers();

  // 点検タブ
  if(el('inp-date')) el('inp-date').onchange = function(){ flushSave(); STATE.date=this.value; render(); };
  if(el('inp-inspector')) el('inp-inspector').onchange = function(){ updateMeta('inspector', this.value); };
  if(el('inp-checker')) el('inp-checker').onchange = function(){ updateMeta('checker', this.value); };
  var jbs = document.querySelectorAll('[data-result]');
  for(var i=0;i<jbs.length;i++){
    jbs[i].onclick = (function(id,val){ return function(){ setResult(id,val); }; })(jbs[i].getAttribute('data-id'), jbs[i].getAttribute('data-result'));
  }
  var nts = document.querySelectorAll('[data-note]');
  for(var i=0;i<nts.length;i++){
    nts[i].onchange = (function(id){ return function(){ setNote(id, this.value); }; })(nts[i].getAttribute('data-note'));
  }
  if(el('btn-clearday')) el('btn-clearday').onclick = clearDay;

  // 点検フィルタ + NGジャンプ

  if(el('btn-jump-ng')) el('btn-jump-ng').onclick = jumpToNG;
  // 点検行の「対策」ボタンと、× の行の対策の要約
  attachCountermeasureHandlers(el('root'));

  // 見本写真サムネイル: タップで拡大(点検画面・項目管理リスト共通)

  // 不具合タブ
  var ids = document.querySelectorAll('[data-issue-detail]');
  for(var i=0;i<ids.length;i++){ ids[i].onchange = (function(id){ return function(){ updateIssue(id,'detail',this.value,true); }; })(ids[i].getAttribute('data-issue-detail')); }
  var ics = document.querySelectorAll('[data-issue-comment]');
  for(var i=0;i<ics.length;i++){ ics[i].onchange = (function(id){ return function(){ updateIssue(id,'comment',this.value,true); }; })(ics[i].getAttribute('data-issue-comment')); }
  var ias = document.querySelectorAll('[data-issue-assignee]');
  for(var i=0;i<ias.length;i++){ ias[i].onchange = (function(id){ return function(){ updateIssue(id,'assignee',this.value,true); }; })(ias[i].getAttribute('data-issue-assignee')); }
  var iss = document.querySelectorAll('[data-issue-status]');
  for(var i=0;i<iss.length;i++){ iss[i].onchange = (function(id){ return function(){ updateIssue(id,'status',this.value); }; })(iss[i].getAttribute('data-issue-status')); }
  var icp = document.querySelectorAll('[data-issue-complete]');
  for(var i=0;i<icp.length;i++){ icp[i].onclick = (function(id){ return function(){ updateIssue(id,'status','完了'); }; })(icp[i].getAttribute('data-issue-complete')); }
  var idl = document.querySelectorAll('[data-issue-delete]');
  for(var i=0;i<idl.length;i++){ idl[i].onclick = (function(id){ return function(){ deleteIssueFromList(id); }; })(idl[i].getAttribute('data-issue-delete')); }

  // 箇所別履歴タブ

  if(el('point-search')){ el('point-search').oninput = function(){ var q=this.value.toLowerCase(); var rows=document.querySelectorAll('.point-row'); for(var i=0;i<rows.length;i++){ var s=rows[i].getAttribute('data-search')||''; rows[i].style.display = (!q || s.indexOf(q)>=0)?'':'none'; } }; }
  // 項目タブ
  if(el('btn-additem')) el('btn-additem').onclick = addItem;
  if(el('new-content')) el('new-content').onkeydown = function(e){ if(e.key==='Enter'&&STATE.editMode) addItem(); };
  if(el('new-no')) el('new-no').onkeydown = function(e){ if(e.key==='Enter'&&STATE.editMode) addItem(); };
  var eis = document.querySelectorAll('[data-edititem]');
  for(var i=0;i<eis.length;i++){ eis[i].onclick = (function(id){ return function(){ openEditItem(id); }; })(eis[i].getAttribute('data-edititem')); }
  var dis = document.querySelectorAll('[data-delitem]');
  for(var i=0;i<dis.length;i++){ dis[i].onclick = (function(id){ return function(){ deleteItem(id); }; })(dis[i].getAttribute('data-delitem')); }

  if(el('new-staff')) el('new-staff').onkeydown = function(e){ if(e.key==='Enter'&&STATE.editMode) addStaff(); };
  var dss = document.querySelectorAll('[data-delstaff]');
  for(var i=0;i<dss.length;i++){ dss[i].onclick = (function(n){ return function(){ deleteStaff(n); }; })(dss[i].getAttribute('data-delstaff')); }

  // 月次タブ
  if(el('inp-month')) el('inp-month').onchange = function(){ STATE.printMonth=this.value; render(); };
  if(el('btn-print')) el('btn-print').onclick = doPrintMonth;
  if(el('btn-excel')) el('btn-excel').onclick = exportExcel;
}

function renderSyncBar(){

// 同期バーのDOMだけを部分更新(画面全体は再描画しない)
function updateSyncBar(){
  var existing = el('sync-bar');
  if(!existing || !existing.parentNode) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = renderSyncBar();
  var fresh = tmp.firstChild;
  if(!fresh) return;
  existing.parentNode.replaceChild(fresh, existing);
  attachSyncHandlers();
}

// ============================================================
// 起動
// ============================================================
// ページを閉じる時、未保存データがあれば警告
// pendingData/saveTimer/issueSavePending は「保存待機中(debounce中)」しか
// 見ていないため、キューに積まれた・送信中のジョブも条件に含める。
// (GASへの往復は数秒かかり、その間に閉じられると送信が中断される)
window.addEventListener('beforeunload', function(e){
  if(pendingData || saveTimer || hasPendingIssueSave() || unsentCount() > 0 || cmHasUnsaved()){
    e.preventDefault();
    e.returnValue = '保存中のデータがあります。このまま閉じますか?';
    return e.returnValue;
  }
});

function initScrollTop(){
  if(document.getElementById('scrolltop-btn')) return;
  var btn = document.createElement('button');
  btn.id = 'scrolltop-btn';
  btn.className = 'no-print';
  btn.setAttribute('aria-label','上へ戻る');
  btn.textContent = '↑';
  btn.style.cssText = 'position:fixed;right:16px;bottom:88px;width:50px;height:50px;border-radius:50%;border:none;background:var(--c-info,#1a73e8);color:#fff;font-size:24px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,0.28);cursor:pointer;z-index:700;display:none;align-items:center;justify-content:center;padding:0;line-height:1';
  btn.onclick = function(){ window.scrollTo({ top:0, behavior:'smooth' }); };
  document.body.appendChild(btn);
  var onScroll = function(){
    if(document.querySelector('.modal-bg')){ btn.style.display='none'; return; }
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    btn.style.display = y > 300 ? 'flex' : 'none';
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}
try { initScrollTop(); } catch(e){}

try {
  // 前回閉じたときに送れなかった分があれば、先に送信を始める
  if(isGasConfigured) restoreUnsent();
  refresh();
} catch(e){
  showFatalError('アプリ起動失敗', e.message + '\n' + (e.stack||''));
}
</script>
</body>
</html>
